# Render deployment blueprint: one always-on web service running the whole app
services:
  - type: web
    name: munshi-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SARVAM_API_KEY
        sync: false            # you paste the key in the Render dashboard
      - key: SARVAM_SPEAKER
        value: shubh
      - key: SARVAM_CHAT_MODEL
        value: sarvam-105b
